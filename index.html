<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Swipe through Kauaʻi activities and get a day-by-day plan for Nov 7–11, 2026.">
<title>Kauaʻi Match</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&family=Zilla+Slab:wght@500;700&display=swap">
<style>
/* Layout: one column. Swipe view = header · weather strip · card · actions. List and Plan are scrolling views in the same column. */
:root{
  --bg:#ECF1EE; --surface:#FFFFFF; --surface2:#DEE7E2; --ink:#12201B; --muted:#56665F; --line:#CFD9D4;
  --accent:#B0502A; --accent-soft:#F3DED3; --on-accent:#FFFFFF;
  --yes:#26804E; --no:#64716C; --star:#C98E12; --on-star:#1A1200;
  --good:#2E8B57; --ok:#C99A2E; --poor:#BF4B3A; --na:#C3CDC8;
  --on-photo:#FFFFFF; --scrim:rgba(6,12,10,.86); --chip-bg:rgba(10,18,15,.55); --stamp-bg:rgba(8,14,12,.42);
  --yes-stamp:#7BE0A4; --no-stamp:#F0F3F1; --star-stamp:#FFD261;
  --backdrop:rgba(10,18,15,.45); --shadow-c:rgba(18,32,27,.16);
  --display:"Zilla Slab", Rockwell, "Roboto Slab", Georgia, serif;
  --body:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1311; --surface:#15201C; --surface2:#1E2B26; --ink:#E6EEEA; --muted:#97A7A0; --line:#27352F;
    --accent:#E2784A; --accent-soft:#3A2419; --on-accent:#1A0F09;
    --yes:#52BE82; --no:#8E9C96; --star:#F0BC45;
    --good:#4CB67C; --ok:#E0B04A; --poor:#E26B58; --na:#34423C;
    --backdrop:rgba(0,0,0,.6); --shadow-c:rgba(0,0,0,.45); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1311; --surface:#15201C; --surface2:#1E2B26; --ink:#E6EEEA; --muted:#97A7A0; --line:#27352F;
  --accent:#E2784A; --accent-soft:#3A2419; --on-accent:#1A0F09;
  --yes:#52BE82; --no:#8E9C96; --star:#F0BC45;
  --good:#4CB67C; --ok:#E0B04A; --poor:#E26B58; --na:#34423C;
  --backdrop:rgba(0,0,0,.6); --shadow-c:rgba(0,0,0,.45); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block;flex:none}
[hidden]{display:none!important}
#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.appbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px 6px}
.brand{min-width:0}
.logo{font-family:var(--display);font-weight:700;font-size:24px;line-height:1;letter-spacing:-.01em;display:block;white-space:nowrap}
.logo em{font-style:normal;color:var(--accent)}
.trip{display:block;font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:6px;align-items:center;flex:none}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.icon-btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.plan-btn{height:38px;padding:0 6px 0 13px;border-radius:19px;border:0;background:var(--ink);color:var(--bg);font-weight:700;font-size:14px;display:flex;align-items:center;gap:7px}
.badge{min-width:24px;height:24px;border-radius:12px;background:var(--accent);color:var(--on-accent);font-size:12px;display:grid;place-items:center;padding:0 6px;font-variant-numeric:tabular-nums}

/* weather strip */
.wx{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;padding:4px 0 8px;border:0;background:none;width:100%;text-align:left}
.wxd{border:1px solid var(--line);border-radius:11px;padding:5px 6px;background:var(--surface);display:grid;gap:1px;min-width:0}
.wxd .wd{display:flex;align-items:center;justify-content:space-between;gap:4px;font-size:12px;font-weight:700;white-space:nowrap}
.wxd .wr{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.wxd .sea{display:inline-block;width:7px;height:7px;border-radius:50%;flex:none}
.c-good{background:var(--good)} .c-ok{background:var(--ok)} .c-poor{background:var(--poor)} .c-na{background:var(--na)}

/* deck */
.deck-view{flex:1;min-height:0;display:flex;flex-direction:column}
.progress{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);padding-bottom:8px;font-variant-numeric:tabular-nums}
.track{flex:1;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.bar{height:100%;width:0;background:var(--accent);transition:width .3s ease}
.deck{position:relative;flex:1;min-height:0;touch-action:none}
.card{position:absolute;inset:0;border-radius:22px;overflow:hidden;background:var(--surface);box-shadow:0 10px 30px var(--shadow-c);display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;will-change:transform;border:1px solid var(--line)}
.card.next{transform:translateY(12px) scale(.955);opacity:.9}
.card.top{cursor:grab}
.card.top.drag{cursor:grabbing}
.ph{position:relative;flex:1 1 auto;min-height:150px;background:var(--surface2);overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.ph::after{content:"";position:absolute;left:0;right:0;bottom:0;height:62%;background:linear-gradient(to top,var(--scrim),transparent);pointer-events:none}
.fallback{position:absolute;inset:0;display:grid;place-items:center;color:var(--on-photo)}
.fallback svg{width:96px;height:96px;opacity:.55}
.f-sea{background:linear-gradient(160deg,#0F6C77,#0A3A48)}
.f-adventure{background:linear-gradient(160deg,#9D4A27,#4A2414)}
.f-nature{background:linear-gradient(160deg,#2F6E46,#163522)}
.f-photo{background:linear-gradient(160deg,#A8456F,#3A1F45)}
.f-culture{background:linear-gradient(160deg,#6B4F8A,#2E2240)}
.f-food{background:linear-gradient(160deg,#B26A1E,#5A320C)}
.f-sunset{background:linear-gradient(160deg,#C8572F,#3C1C3A)}
.f-run{background:linear-gradient(160deg,#1F6F78,#1B2E3D)}
.ph-top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;z-index:2}
.chip{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:999px;background:var(--chip-bg);color:var(--on-photo);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.chip.st-ok::before,.chip.st-check::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:1px}
.chip.st-ok::before{background:var(--yes-stamp)} .chip.st-check::before{background:var(--star-stamp)}
.ph-bot{position:absolute;left:16px;right:16px;bottom:12px;z-index:2;color:var(--on-photo)}
.ph-bot h2{font-family:var(--display);font-weight:700;font-size:clamp(25px,7.2vw,31px);line-height:1.04;margin:0;text-wrap:balance;letter-spacing:-.01em}
.ph-bot p{margin:5px 0 0;font-size:13px;opacity:.92}
.stamp{position:absolute;top:30px;z-index:3;font-family:var(--display);font-weight:700;font-size:32px;line-height:1;letter-spacing:.08em;text-transform:uppercase;padding:6px 12px 4px;border:4px solid currentColor;border-radius:10px;background:var(--stamp-bg);opacity:0;pointer-events:none}
.stamp.yes{left:20px;color:var(--yes-stamp);transform:rotate(-13deg)}
.stamp.no{right:20px;color:var(--no-stamp);transform:rotate(13deg)}
.stamp.star{left:50%;top:38%;color:var(--star-stamp);transform:translateX(-50%) rotate(-5deg)}
.cb{flex:none;padding:12px 16px 14px;display:grid;gap:8px}
.price{font-family:var(--display);font-size:23px;font-weight:700;line-height:1.1}
.price small{font-family:var(--body);font-size:13px;font-weight:400;color:var(--muted)}
.facts{display:flex;flex-wrap:wrap;gap:4px 14px;margin:0;padding:0;list-style:none;font-size:13px;color:var(--muted)}
.facts li{display:flex;align-items:center;gap:5px}
.facts .bk{color:var(--accent);font-weight:700}
.why{margin:0;font-size:14px;line-height:1.4}
.fit{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
.cells{display:flex;gap:5px}
.cell{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;letter-spacing:0;text-transform:none;font-variant-numeric:tabular-nums}
.cell i{display:block;width:26px;height:6px;border-radius:3px;background:var(--na)}
.cell.good i{background:var(--good)} .cell.ok i{background:var(--ok)} .cell.poor i{background:var(--poor)}
.cell.na i{background:repeating-linear-gradient(135deg,var(--na) 0 3px,transparent 3px 6px)}
.cell.na{opacity:.75}
@media (max-height:700px){.why{display:none}}
@media (max-height:600px){.fit{display:none}.cb{padding-block:10px}}
.actions{display:flex;justify-content:center;align-items:center;gap:14px;padding-block:12px 2px}
.act{border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;box-shadow:0 4px 14px var(--shadow-c);transition:transform .15s ease}
.act:active{transform:scale(.9)}
.act:disabled{opacity:.4;cursor:default}
.act-l{width:64px;height:64px}.act-m{width:52px;height:52px}.act-s{width:42px;height:42px}
.act.no{color:var(--no)}.act.yes{color:var(--yes)}.act.star{color:var(--star)}
.hint{text-align:center;font-size:12px;color:var(--muted);margin:4px 0 10px}
.done{position:absolute;inset:0;border-radius:22px;border:1.5px dashed var(--line);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:12px;padding:24px}
.done h2{font-family:var(--display);font-size:30px;margin:0;line-height:1.05}
.done p{margin:0;color:var(--muted)}

/* buttons */
.btn{min-height:42px;padding:0 15px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.small{min-height:32px;padding:0 10px;border-radius:9px;font-size:13px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.link{color:var(--accent);font-weight:700;text-decoration:none}
.link:hover{text-decoration:underline}

/* scrolling views */
.scroll-view{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
.view-head{padding-top:4px}
.back{border:0;background:none;padding:6px 0;color:var(--accent);font-weight:700;display:flex;align-items:center;gap:4px}
.view-head h1{font-family:var(--display);font-size:30px;line-height:1.05;margin:6px 0 4px;text-wrap:balance}
.sum{margin:0 0 12px;color:var(--muted);font-size:14px}
.sum b{color:var(--ink);font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}
.panel{margin-top:16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:12px 14px}
.panel h3{margin:0 0 6px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.panel summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center}
.panel summary::-webkit-details-marker{display:none}
.booklist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.booklist li{display:grid;grid-template-columns:20px 1fr;gap:8px;font-size:14px;align-items:start}
.booklist input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--accent)}
.booklist small{display:block;color:var(--muted);font-size:12px}

/* list view */
.search{width:100%;min-height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 12px;font:500 15px var(--body);margin:2px 0 10px;-webkit-appearance:none;appearance:none}
.fchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.fchips::-webkit-scrollbar{display:none}
.fchip{flex:none;min-height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.fchip small{color:var(--muted);font-weight:600;font-size:12px;font-variant-numeric:tabular-nums}
.fchip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fchip.on small{color:inherit;opacity:.75}
.lrows{list-style:none;margin:4px 0 0;padding:0}
.lrow{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.lopen{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;text-align:left}
.lthumb{width:52px;height:52px;border-radius:10px;object-fit:cover;flex:none;display:grid;place-items:center;color:var(--on-photo);background:var(--surface2)}
.ltx{min-width:0;display:grid;gap:2px}
.ltx b{font-size:14px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ltx span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;gap:4px;flex:none}
.sg{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;color:var(--muted)}
.sg.no.on{background:var(--no);border-color:var(--no);color:var(--bg)}
.sg.yes.on{background:var(--yes);border-color:var(--yes);color:var(--bg)}
.sg.star.on{background:var(--star);border-color:var(--star);color:var(--on-star)}
.lempty{padding:24px 0;color:var(--muted);text-align:center}

/* plan */
.day{margin-top:22px}
.day-h{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:6px}
.day-h h2{font-family:var(--display);font-size:24px;line-height:1;margin:0;white-space:nowrap}
.day-h .dwx{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);text-align:right;min-width:0}
.day-sub{margin:6px 0 0;font-size:12px;color:var(--muted)}
.tl{list-style:none;margin:0;padding:0}
.ev{display:grid;grid-template-columns:50px minmax(0,1fr);gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.ev time{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;line-height:1.2}
.ev time small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.ev .main{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start}
.ev h3{margin:0;font-size:15px;line-height:1.25}
.ev .meta{font-size:12px;color:var(--muted);margin-top:2px}
.ev .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.ev .thumb{width:58px;height:58px;border-radius:10px;object-fit:cover;display:grid;place-items:center;color:var(--on-photo);overflow:hidden}
.ev img.thumb{background:var(--surface2)}
.ev .thumb svg{width:28px;height:28px;opacity:.7}
.ev.item{cursor:pointer}
.ev.item:hover h3{color:var(--accent)}
.ev.fixed time,.ev.fixed h3{color:var(--muted);font-weight:600}
.drive{display:grid;grid-template-columns:50px minmax(0,1fr);gap:10px;font-size:12px;color:var(--muted);padding:5px 0;border-bottom:1px solid var(--line);align-items:center}
.drive span{display:flex;align-items:center;gap:6px}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.tag.book{background:var(--accent-soft);color:var(--accent)}
.tag.star{color:var(--star)}
.tag.match{background:var(--ink);color:var(--bg)}
.empty-day{padding:12px 0;color:var(--muted);font-size:14px;border-bottom:1px solid var(--line)}
.unp{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.unp li{display:grid;gap:6px}
.unp b{font-size:14px}
.unp .why2{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.dchip{min-height:32px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600}
.dchip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.duo-grid{display:grid;gap:10px;margin-top:10px}
.field{display:grid;gap:5px;font-size:13px;color:var(--muted)}
.field input,.field select{min-height:42px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 10px;font:600 15px var(--body);width:100%;min-width:0}
.inline{display:flex;gap:8px}
.inline input{flex:1}
.foot{margin-top:26px;font-size:12px;color:var(--muted);display:grid;gap:6px}

/* sheets */
.backdrop{position:fixed;inset:0;background:var(--backdrop);z-index:20;opacity:0;transition:opacity .2s ease}
.backdrop.open{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:88%;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border-radius:20px 20px 0 0;padding:8px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px var(--shadow-c)}
.sheet.open{transform:translateY(0)}
@media (min-width:560px){.sheet{left:50%;right:auto;width:520px;transform:translate(-50%,105%)}.sheet.open{transform:translate(-50%,0)}}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sh-close{position:sticky;top:0;float:right;margin:-2px -4px 0 8px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;z-index:2}
.sheet h2{font-family:var(--display);font-size:26px;line-height:1.08;margin:2px 0 4px;text-wrap:balance}
.sheet h3{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
.sheet p{margin:0 0 8px}
.sheet .sub{color:var(--muted);font-size:14px;margin-bottom:10px}
.hero{width:100%;aspect-ratio:16/9;max-width:100%;border-radius:14px;object-fit:cover;background:var(--surface2);display:block}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;min-width:0}
.daylist{display:grid;gap:8px}
.drow{display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:start;font-size:14px}
.drow .dl{display:flex;align-items:center;gap:6px;font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.fine{font-size:12px;color:var(--muted)}
.credit{font-size:12px;color:var(--muted);margin-top:12px}
.sheet .btnrow{margin-top:14px}
.wxtable{display:grid;gap:12px}
.wxrow{display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:start}
.wxrow b{display:block}
.wxrow .rr{font-size:13px;color:var(--muted)}
.credits{list-style:none;padding:0;margin:0;display:grid;gap:6px;font-size:12px;color:var(--muted)}
.credits a{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:40;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.stepper{display:flex;align-items:center;gap:10px}

const KEY = 'kauai-match-v2', KEY_OLD = 'kauai-match-v1';

function load(){
  try{
    let raw = localStorage.getItem(KEY), migrated = false;
    if(!raw){ raw = localStorage.getItem(KEY_OLD); migrated = !!raw; }
    if(!raw) return;
    const o = JSON.parse(raw);
    DEC = o.DEC||{}; HIST = o.HIST||[]; PARTNER = o.PARTNER||null; PINS = o.PINS||{}; EXCL = o.EXCL||{}; BOOKED = o.BOOKED||{};
    if(o.S && o.S.people) S.people = o.S.people;
    if(!migrated && o.S && o.S.carBuf) S.carBuf = o.S.carBuf;
    for(const k of Object.keys(DEC)) if(!ACTM[k]) delete DEC[k];
    for(const k of Object.keys(PINS)) if(!ACTM[k] || !DAY[PINS[k]] || !ACTM[k].days.includes(PINS[k])) delete PINS[k];
    if(PARTNER) for(const k of Object.keys(PARTNER)) if(!ACTM[k]) delete PARTNER[k];
    HIST = HIST.filter(id=>DEC[id]);
    if(migrated) save();
  }catch(e){}
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify({DEC,HIST,PARTNER,PINS,EXCL,BOOKED,S})); }catch(e){} }

    {id:'d8',  start:345, end:1320, from:'LAW', to:'LAW'},   // jet lag helps: 5:45 here is 7:45 in LA
    {id:'d9',  start:345, end:1320, from:'LAW', to:'LAW'},

    {id:'d11', start:390, end:carBack(), from:'HAN', to:'LIH'}
  ];
}
function slotsFor(a, d){
  if(!a.days.includes(d.id)) return [];
  const out=[];
  if(a.perDay){
    for(const p of [].concat(a.perDay[d.id]||[])) for(let s=p.w[0]; s+a.dur<=p.w[1]; s+=15) out.push({s,e:s+a.dur,zone:p.zone,where:p.where});
    return out;
  }
  if(a.fix){ for(const [s,e] of a.fix) out.push({s,e,zone:a.zone,meal:a.meal}); return out; }
  const wins = a.wins || [[a.win[0], a.win[1]]];
  for(const [w0,w1,meal] of wins){
    const last = Math.min(a.lastStart ?? Infinity, w1-a.dur);
    for(let s=w0; s<=last; s+=15) out.push({s,e:s+a.dur,zone:a.zone,meal:meal||a.meal});
  }
  return out;
}
function fits(day, sl, d, a, prio){
  const items = day.items;
  for(const x of items) if(sl.s < x.e && x.s < sl.e) return null;
  if(sl.meal==='lunch' || sl.meal==='dinner' || sl.meal==='breakfast'){ for(const x of items) if(x.meal===sl.meal) return null; }
  if(a && a.cat==='run' && items.some(x=>x.a.cat==='run')) return null;
  let i=0; while(i<items.length && items[i].s < sl.s) i++;
  const prev=items[i-1], next=items[i];
  const pz = prev ? prev.zone : d.from, pe = prev ? prev.e : d.start;
  const nz = next ? next.zone : d.to,   ns = next ? next.s : d.end;
  const z = sl.zone==='*' ? pz : sl.zone;
  const tin = drive(pz,z) + (prev?BUF:0), tout = drive(z,nz) + (next?BUF:0);
  if(sl.s < pe + tin) return null;
  if(sl.e + tout > ns) return null;
  const delta = drive(pz,z) + drive(z,nz) - drive(pz,nz);
  if(a && (prio||2) < 3){
    if(a.cat==='food' && delta > 35) return null;
    if(a.dur <= 30 && delta > 50) return null;
  }
  return {i, z, delta};
}
function busy(day){ return day.items.reduce((t,x)=>t+(x.e-x.s),0); }
function quality(a, dId, s){
  const w = WX[dId]; let q = 0;
  if(a.sea) q += (w.sc[a.sea]-2)*(a.sea==='napali'?8:5);
  if(a.rain) q += (w.sc.hike-2)*3;
  if(a.sky) q += (w.sc.sky-2)*2;
  if(a.pref==='early') q += s<=480 ? 3 : -(s-480)/60;
  else if(a.pref==='am') q += s<=600 ? 1.5 : 0;
  else if(!a.fix && s<480) q -= (480-s)/30;
  if(dId==='d11') q -= 1.5;
  return q;
}
function score(a, d, sl, f, day){
  return quality(a, d.id, sl.s) - f.delta/12 - busy(day)/90 - sl.s/2400;
}
function insertItem(day,it){ day.items.push(it); day.items.sort((x,y)=>x.s-y.s); }
function removeItem(day,it){ const k=day.items.indexOf(it); if(k>=0) day.items.splice(k,1); }
function placeBest(state, conf, L){
  const a=L.a, pin=PINS[a.id]; let best=null;
  for(const d of conf){
    if(pin && d.id!==pin) continue;
    const day=state[d.id];
    for(const sl of slotsFor(a,d)){
      const f=fits(day,sl,d,a,L.prio); if(!f) continue;
      const sc=score(a,d,sl,f,day);
      if(!best || sc>best.sc+1e-9) best={d,sl,f,sc};
    }
  }
  if(!best) return false;
  insertItem(state[best.d.id], {L, a, s:best.sl.s, e:best.sl.e, zone:best.f.z, where:best.sl.where, meal:best.sl.meal, prio:L.prio, pinned:!!pin});
  return true;
}
function dayFits(a, dId){
  const d = confDays().find(x=>x.id===dId); if(!d) return false;
  const day={items:[]};
  return slotsFor(a,d).some(sl=>fits(day,sl,d,a,3));
}
function collectLikes(){
  const out=[];
  for(const a of ACT){
    if(EXCL[a.id]) continue;
    const m = DEC[a.id]||0, p = PARTNER ? (PARTNER[a.id]||0) : 0;
    const ml = m>=2, pl = p>=2;
    if(!ml && !pl) continue;
    let prio = Math.max(ml?m:0, pl?p:0);
    const match = ml && pl;
    if(match) prio += 1;
    out.push({a, prio, match, mine:ml, theirs:pl, star:(m===3||p===3)});
  }
  return out;
}
function reasonFor(L, state, conf){
  const a=L.a;
  const feas = a.days.filter(id=>dayFits(a,id));
  if(!feas.length) return 'Its times don’t fit your days (you land Saturday at 11:03 and fly Wednesday at 15:04).';
  if(PINS[a.id]) return `Doesn’t fit on ${DAY[PINS[a.id]].short}: that day is already full.`;
  const parts=[];
  for(const id of feas){
    const d=conf.find(x=>x.id===id), sls=slotsFor(a,d);
    const its = state[id].items;
    const hit = its.find(x=>x.meal && sls.some(sl=>sl.meal===x.meal)) || its.find(x=>sls.some(sl=>sl.s < x.e+45 && x.s < sl.e+45));
    if(hit) parts.push(`${DAY[id].dow} ${hit.a.t}`);
  }
  return parts.length ? `Clashes with: ${parts.join(' · ')}.` : 'Your available days are already full.';
}
function rng(seed){ return ()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function dayDrive(day, d){ let t=0, z=d.from; for(const x of day.items){ t+=drive(z,x.zone); z=x.zone; } return t+drive(z,d.to); }
const PW = {1:60, 2:100, 3:600, 4:1200, 5:1500};
function value(L){ let v = PW[Math.min(L.prio,5)] * (0.35 + 0.65*Math.min(L.a.dur,300)/300); if(L.unique) v *= 1.6; return v; }
/* lunch: a lunch place, an activity that spans noon (boats and long hikes include or pack lunch), or a free 40 min between 11:00 and 14:30 */
function lunchInfo(day, d){
  if(d.id==='d11') return {ok:true};
  for(const x of day.items) if(x.meal==='lunch' || (x.s<=720 && x.e>=780)) return {ok:true};
  let t=d.start, z=d.from;
  for(let i=0;i<=day.items.length;i++){
    const x=day.items[i], dr = x ? drive(z,x.zone) : 0;
    // eat at the next stop (after driving) or before leaving: same free time, different position in the noon window
    for(const [s0,e0] of [[t+dr, x ? x.s : d.end],[t, x ? x.s-dr : d.end]]){
      const start=Math.max(s0,660), end=Math.min(e0,870);
      if(end-start>=40) return {ok:true, slot:{before:i, at:Math.min(Math.max(start,720), end-40)}};
    }
    if(x){ t=x.e; z=x.zone; }
  }
  return {ok:false};
}
function evalState(state, conf){
  let tot=0;
  for(const d of conf){
    const day=state[d.id], dr=dayDrive(day,d), b=busy(day);
    for(const x of day.items) tot += value(x.L) + quality(x.a, d.id, x.s);
    tot -= dr*0.3;
    tot -= Math.max(0, b+dr-(d.id==='d7' ? 420 : 660))*0.5;   // landing day: keep it lighter
    if(!lunchInfo(day,d).ok) tot -= 80;
  }
  return tot;
}
function cloneState(state){ const st={}; for(const k in state) st[k]={items:state[k].items.map(x=>({...x}))}; return st; }
function runGreedy(conf, order){
  const state={}; conf.forEach(d=>state[d.id]={items:[]});
  const un=[];
  for(const L of order) if(!placeBest(state,conf,L)) un.push(L);
  return {state, un};
}
function tryInsert(state, conf, L){
  const a=L.a, pin=PINS[a.id];
  let best=null, bestScore=evalState(state,conf);
  for(const d of conf){
    if(pin && d.id!==pin) continue;
    const all = slotsFor(a,d);
    const slots = (a.fix||a.perDay) ? all : all.filter((sl,i)=>i%2===0);
    for(const sl of slots){
      const day=state[d.id];
      if(day.items.some(x=>x.pinned && sl.s < x.e+30 && x.s < sl.e+30)) continue;
      const bl = day.items.filter(x => sl.s < x.e + 60 && x.s < sl.e + 60);
      if(!bl.length) continue;
      const st = cloneState(state), dd = st[d.id];
      const ev = bl.map(x=>dd.items.find(y=>y.a===x.a));
      ev.forEach(x=>removeItem(dd,x));
      const f = fits(dd, sl, d, a, L.prio); if(!f) continue;
      insertItem(dd, {L,a,s:sl.s,e:sl.e,zone:f.z,where:sl.where,meal:sl.meal,prio:L.prio,pinned:!!pin});
      const un=[]; for(const x of ev) if(!placeBest(st,conf,x.L)) un.push(x.L);
      const sc = evalState(st,conf) - un.reduce((t,u)=>t+value(u)*0.2,0);
      if(sc > bestScore + 1e-6){ bestScore=sc; best={state:st, un}; }
    }
  }

}
function buildPlan(){
  const conf = confDays();
  const likes = collectLikes();
  const groups={}, cand=[], alts=[];
  for(const L of likes){ if(L.a.group) (groups[L.a.group] ||= []).push(L); else cand.push(L); }
  for(const g in groups){
    const arr = groups[g].sort((x,y)=> (PINS[y.a.id]?1:0)-(PINS[x.a.id]?1:0) || y.prio-x.prio || x.a.order-y.a.order);
    cand.push(arr[0]); arr.slice(1).forEach(x=>alts.push({L:x, of:arr[0].a}));
  }
  cand.forEach(L=>{
    let n=0, days=0;
    for(const d of conf){ const k=slotsFor(L.a,d).filter(sl=>fits({items:[]},sl,d,L.a,3)).length; n+=k; if(k) days++; }
    L.flex=n; L.unique = days===1;
  });
  const cls = L => (PINS[L.a.id]?0:100) + (6-Math.min(L.prio,5))*10 + (L.a.cat==='food'?5:0);
  const base = [...cand].sort((x,y)=> cls(x)-cls(y) || x.flex-y.flex || y.a.dur-x.a.dur || x.a.order-y.a.order);
  let seed = 7; for(const L of cand) for(const ch of L.a.id+L.prio) seed = (seed*31 + ch.charCodeAt(0))|0;
  for(const k in PINS) for(const ch of k+PINS[k]) seed = (seed*31 + ch.charCodeAt(0))|0;
  const rand = rng(seed);
  const runs=[];
  const RUNS = cand.length < 3 ? 1 : 100;
  for(let r=0; r<RUNS; r++){
    let order = base;
    if(r>0){ const key=new Map(cand.map(L=>[L, cls(L) + rand()*4 + Math.log2(1+L.flex)*0.15])); order=[...cand].sort((x,y)=>key.get(x)-key.get(y)); }
    const res = runGreedy(conf, order);
    res.score = evalState(res.state, conf) - res.un.reduce((t,L)=>t+value(L)*0.2,0);
    runs.push(res);
  }
  runs.sort((x,y)=>y.score-x.score);
  const seen=new Set(); let best=null;
  for(const res of runs){
    const sig = JSON.stringify(conf.map(d=>res.state[d.id].items.map(x=>x.a.id+x.s)));
    if(seen.has(sig)) continue; seen.add(sig);
    if(seen.size>6) break;
    let state=res.state, unplaced=[...res.un].sort((x,y)=>value(y)-value(x));
    for(let guard=0, i=0; i<unplaced.length && guard<40; guard++){
      const L = unplaced[i];
      const r = tryInsert(state, conf, L);
      if(r){ state = r.state; unplaced.splice(i,1); for(const u of r.un) unplaced.push(u); unplaced.sort((x,y)=>value(y)-value(x)); i=0; }
      else i++;
    }
    const sc = evalState(state,conf) - unplaced.reduce((t,L)=>t+value(L)*0.2,0);
    if(!best || sc > best.sc + 1e-9) best={state, unplaced, sc};

}
/* fixed moments around the planned items (check-outs, arrival back) */
function frame(P, d){
  const its=P.state[d.id].items, last=its[its.length-1], f={};
  let k=0; while(k<its.length && its[k].zone===d.from) k++;   // items before leaving the inn's / hotel's area
  const out=its[k], prevZ = k ? its[k-1].zone : d.from;
  const leave = out ? out.s - drive(prevZ, out.zone) - (k?BUF:15) : null;
  f.k = k;
  if(d.id==='d10') f.checkout = Math.max(d.start, Math.min(630, leave ?? (k ? its[k-1].e+5 : 600)));
  if(d.id==='d11') f.checkout = Math.max(d.start, leave ?? Math.max(k ? its[k-1].e+5 : d.start, d.end - drive(d.from,'LIH') - 20));
  f.home = last ? Math.min(d.end, last.e + drive(last.zone, d.to)) : null;
  return f;
}

/* ---------- weather fit per card ---------- */
function rainFor(zone, w){ const side = zone==='*' ? 'W' : ZONES[zone].side; return w.r[side]; }
function perDayList(a, dId){ return [].concat((a.perDay && a.perDay[dId]) || []); }
function fitness(a, dId){
  if(!a.days.includes(dId)) return {c:'na', t:'Closed that day'};
  if(!dayFits(a,dId)) return {c:'na', t: dId==='d11' ? 'Doesn’t fit before the flight' : (dId==='d7' ? 'Doesn’t fit after landing' : 'Outside its hours')};
  const w=WX[dId]; let s;
  if(a.sea) s=w.sc[a.sea]; else if(a.rain) s=w.sc.hike; else if(a.sky) s=w.sc.sky;
  else { const z = a.perDay ? perDayList(a,dId)[0].zone : a.zone; s = rainFor(z,w)>=35 ? 2 : 3; }
  const c = s>=3 ? 'good' : s===2 ? 'ok' : 'poor';
  const labels = {
    napali:['Rough seas: not advised','Seas easing: doable','Calmer seas: the best day'],
    north:['North swell: better avoid','North surf easing','Fair conditions up north'],
    south:['','','South side calm']
  };
  const t = a.sea ? labels[a.sea][s-1] : (a.rain ? ['Showers likely','A few showers','Dry'][s-1] : (a.sky ? ['Patchy clouds','Dark, clear sky','Dark, clear sky'][s-1] : (s>=3?'Good weather':'Possible showers')));
  return {c, t};
}

/* ---------- header & weather ---------- */
function renderWx(){
  $('#wxStrip').innerHTML = DAYS.map(d=>{ const w=WX[d.id]; const side = Math.max(w.r.N,w.r.E);
    return `<span class="wxd"><span class="wd">${d.short}<i class="sea c-${w.seaC}"></i></span><span class="wr">${sized(IC[w.ic],16)}${side}%</span></span>`; }).join('');
}

/* ---------- deck ---------- */
let drag=null, flying=false;
const queue = () => ACT.filter(a=>!DEC[a.id]);
function daysTxt(ds){
  if(ds.length===DAYS.length) return 'Every day';
  if(ds.length===1) return DAY[ds[0]].short + ' only';
  const idx = ds.map(id=>DAYS.findIndex(d=>d.id===id)); const cont = idx.every((v,i)=>i===0||v===idx[i-1]+1);
  return cont ? `${DAY[ds[0]].dow}–${DAY[ds[ds.length-1]].dow}` : ds.map(id=>DAY[id].dow).join(', ');
}
function whenTxt(a){
  if(a.when) return a.when;
  const ds = a.days.filter(id=>dayFits(a,id));
  if(!ds.length) return 'Not on your days';
  const t = a.fix ? a.fix.map(([s])=>hm(s)).join(' or ') : (a.wins||[a.win]).map(([w0,w1])=>`${hm(w0)}–${hm(Math.min(w1,(a.lastStart??w1)+a.dur))}`).join(' or ');
  return `${daysTxt(ds)} · ${t}`;
}
function catChip(a){ return `<span class="chip">${a.ig && a.cat!=='photo' ? sized(IC.camera,13) : ''}${CAT[a.cat].n}</span>`; }
function cardHTML(a, cls){
  const ph = HAS_IMG.has(a.id) ? `<img src="img/${a.id}.webp" alt="" decoding="async" draggable="false">` : `<div class="fallback f-${a.cat}">${CAT_IC[a.cat]}</div>`;
  const st = a.st==='ok' ? '<span class="chip st-ok">Open</span>' : '<span class="chip st-check">To verify</span>';
  const cells = DAYS.map(d=>{const f=fitness(a,d.id); return `<span class="cell ${f.c}" title="${esc(d.short+': '+f.t)}"><i></i>${d.k}</span>`;}).join('');
  return `<article class="card ${cls}" data-id="${a.id}" aria-label="${esc(a.t)}">
    <div class="ph">${ph}
      <div class="ph-top">${catChip(a)}${st}</div>
      <div class="stamp yes">Yes</div><div class="stamp no">No</div><div class="stamp star">Hōkū</div>
      <div class="ph-bot"><h2>${esc(a.t)}</h2><p>${esc(a.op)}</p></div>
    </div>
    <div class="cb">
      <div class="price">${esc(a.p)} ${a.pu?`<small>${esc(a.pu)}</small>`:''}</div>
      <ul class="facts"><li>${IC.clock}${durTxt(a)}</li><li>${IC.cal}${esc(whenTxt(a))}</li>${a.book?`<li class="bk">${IC.ticket}Book</li>`:''}</ul>

}
function renderDeck(){
  const q = queue(), deck=$('#deck');
  const total=ACT.length, done=total-q.length;
  $('#progBar').style.width = (done/total*100)+'%';
  $('#progTxt').textContent = `${done} / ${total}`;
  const likes = ACT.filter(a=>DEC[a.id]>=2).length;
  setPlanBtn();
  $('#bUndo').disabled = !HIST.length;
  ['#bNo','#bYes','#bStar','#bInfo'].forEach(s=>$(s).disabled = !q.length);
  if(!q.length){
    const stars = ACT.filter(a=>DEC[a.id]===3).length;
    deck.innerHTML = `<div class="done"><h2>All swiped</h2><p>${likes} yes, ${stars} of them Hōkū. Now the plan.</p>
      <button class="btn primary" id="bMake">Build the plan</button>
      <div class="btnrow"><button class="btn" id="bReview">Review the no’s</button><button class="btn" id="bSeeList">See the list</button></div></div>`;
    $('#bMake').onclick = showPlan;
    $('#bSeeList').onclick = showList;

    return;
  }

  [q[1],q[2],q[3]].forEach(a=>{ if(a && HAS_IMG.has(a.id)){ const im=new Image(); im.src=`img/${a.id}.webp`; } });

}
function bindCard(el){
  if(!el) return;
  el.addEventListener('pointerdown', e=>{
    if(flying || e.button>0) return;
    drag={el, x0:e.clientX, y0:e.clientY, dx:0, dy:0, t0:performance.now(), id:e.pointerId};
    el.setPointerCapture(e.pointerId); el.classList.add('drag'); el.style.transition='none';
  });
  el.addEventListener('pointermove', e=>{
    if(!drag || drag.id!==e.pointerId) return;
    drag.dx=e.clientX-drag.x0; drag.dy=e.clientY-drag.y0;
    requestAnimationFrame(()=>{ if(!drag) return; paintDrag(el, drag.dx, drag.dy); });
  });
  const end = e=>{
    if(!drag || drag.id!==e.pointerId) return;
    const {dx,dy,t0}=drag; drag=null; el.classList.remove('drag');
    const dt=performance.now()-t0, w=el.offsetWidth;
    if(Math.abs(dx)<6 && Math.abs(dy)<6 && dt<350){ resetCard(el); openDetails(el.dataset.id); return; }
    const vx = dx/Math.max(dt,1);
    if(dy < -110 && Math.abs(dy) > Math.abs(dx)) return decide(3, el);
    if(dx > w*0.28 || vx > .55) return decide(2, el);
    if(dx < -w*0.28 || vx < -.55) return decide(1, el);
    resetCard(el);
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', ()=>{ if(drag){ drag=null; resetCard(el);} });
}
function paintDrag(el,dx,dy){
  el.style.transform = `translate(${dx}px,${dy}px) rotate(${dx*0.05}deg)`;
  const up = dy<0 && Math.abs(dy)>Math.abs(dx);
  el.querySelector('.stamp.yes').style.opacity = up?0:Math.max(0,Math.min(1,dx/90));
  el.querySelector('.stamp.no').style.opacity = up?0:Math.max(0,Math.min(1,-dx/90));
  el.querySelector('.stamp.star').style.opacity = up?Math.max(0,Math.min(1,-dy/90)):0;
  const nx=$('#deck .card.next'); if(nx){ const p=Math.min(1,Math.hypot(dx,dy)/160); nx.style.transform=`translateY(${12-12*p}px) scale(${.955+.045*p})`; }
}
function resetCard(el){
  el.style.transition='transform .28s cubic-bezier(.2,.9,.3,1.2)'; el.style.transform='';
  el.querySelectorAll('.stamp').forEach(s=>s.style.opacity=0);
  const nx=$('#deck .card.next'); if(nx){ nx.style.transition='transform .28s'; nx.style.transform=''; }
}
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
function decide(v, el){
  const top = el || $('#deck .card.top'); if(!top || flying) return;
  const id = top.dataset.id;
  const commit = ()=>{ DEC[id]=v; HIST.push(id); if(HIST.length>200) HIST.shift(); save(); flying=false; renderDeck(); };
  if(navigator.vibrate) try{ navigator.vibrate(v===3?[12,30,12]:10); }catch(e){}
  if(REDUCED){ commit(); return; }
  flying=true;
  const w = top.offsetWidth;
  const st = top.querySelector(v===2?'.stamp.yes':v===1?'.stamp.no':'.stamp.star'); if(st) st.style.opacity=1;
  const tx = v===2 ? w*1.5 : v===1 ? -w*1.5 : 0, ty = v===3 ? -top.offsetHeight*1.2 : 40;
  top.style.transition='transform .32s cubic-bezier(.3,.6,.4,1), opacity .32s';
  top.style.transform=`translate(${tx}px,${ty}px) rotate(${v===3?0:(v===2?18:-18)}deg)`;
  top.style.opacity='0';
  setTimeout(commit, 300);
}
function undo(){
  if(flying) return;
  const id=HIST.pop(); if(!id) return;
  delete DEC[id]; save(); renderDeck(); toast('Choice undone');
}

/* ---------- list view ---------- */
const DEC_F = [['all','All'],['todo','To swipe'],['yes','Yes'],['star','Hōkū'],['no','No']];
function decKey(a){ const d=DEC[a.id]||0; return d===3?'star':d===2?'yes':d===1?'no':'todo'; }
function listMatch(a){
  if(LF.dec!=='all' && decKey(a)!==LF.dec) return false;

  return true;
}

function costOf(a){ return (a.pp||0)*S.people + (a.grp||0); }
function itemTags(it){
  const t=[];
  if(it.L.match) t.push('<span class="tag match">Match</span>');

  if(it.pinned) t.push('<span class="tag">Pinned</span>');
  return t.join('');
}
function zoneName(z){ return z==='*' ? '' : ZONES[z].s; }
function fixedEv(time, title, meta, icon){
  return `<li class="ev fixed"><time>${time}</time><div class="main"><div><h3>${title}</h3>${meta?`<div class="meta">${meta}</div>`:''}</div><span class="thumb" style="background:none;color:var(--muted)">${icon||''}</span></div></li>`;
}
function driveRow(a,b){

function isUnpriced(a){ return !a.pp && !a.grp && !['Free','By donation'].includes(a.p); }
function renderPlan(){
  const P = buildPlan(); lastPlan=P;
  const v=$('#planView');
  const items = P.conf.flatMap(d=>P.state[d.id].items);
  const total = items.reduce((t,x)=>t+costOf(x.a),0);
  const unknown = items.filter(x=>isUnpriced(x.a)).length;
  const books = items.filter(x=>x.a.book);
  const likesN = P.likes.length;
  const canDl = !!DL || NATIVE;
  const dlNote = DL ? 'The .ics comes inside a .zip: open it and import it into Google, Apple or Outlook Calendar.'
    : NATIVE ? 'Import the .ics file into Google, Apple or Outlook Calendar.'
    : 'Calendar download works in the Claude app; here you can copy the text or add each event to Google Calendar from its details.';

  let h = `<div class="view-head">
    <button class="back" id="bBack">${IC.back}Swipe more activities</button>
    <h1>Your plan</h1>
    <p class="sum"><b>${items.length}</b> activities planned from ${likesN} picks · about <b>${money(total)}</b> for ${S.people} ${S.people===1?'person':'people'}${unknown?` + ${unknown} with price to check`:''}</p>
    <div class="btnrow"><button class="btn primary" id="bIcs" ${canDl?'':'hidden'}>${IC.down}Calendar (.ics)</button><button class="btn" id="bCopy">${IC.copy}Copy as text</button></div>
    <p class="note">${dlNote}</p>
  </div>`;

  if(!likesN){
    h += `<div class="panel"><h3>No picks yet</h3><p>Swipe the activities, or tick them in the list: the plan builds itself.</p><div class="btnrow"><button class="btn primary" id="bBack2">Start swiping</button><button class="btn" id="bToList">Open the list</button></div></div>`;
    v.innerHTML=h; $('#bBack').onclick=showDeck; $('#bBack2').onclick=showDeck; $('#bToList').onclick=showList; return;
  }

  const code = myCode();
  const pStats = PARTNER ? (()=>{ let m=0,o=0; for(const a of ACT){ const x=(DEC[a.id]||0)>=2, y=(PARTNER[a.id]||0)>=2; if(x&&y) m++; else if(y) o++; } return `Merged: ${m} matches, ${o} picks only the other person made.`; })() : '';
  h += `<details class="panel" id="duo" ${PARTNER?'open':''}><summary>Two of you? Merge your picks <span class="fine">${PARTNER?'on':''}</span></summary>
     <div class="duo-grid">
       <label class="field" for="myCode">Your code (send it to the other person)<span class="inline"><input id="myCode" readonly value="${code}"><button class="btn small" id="bCode">${IC.copy}Copy</button></span></label>
       <label class="field" for="theirCode">The other person’s code<span class="inline"><input id="theirCode" placeholder="K…" autocomplete="off" spellcheck="false"><button class="btn small primary" id="bJoin">Merge</button></span></label>
       <p class="fine" id="duoMsg">${PARTNER?esc(pStats)+' Matches count as Hōkū.':'Activities you both like become a “Match” and get priority in the plan.'}</p>
       ${PARTNER?'<button class="btn small" id="bUnjoin">Unlink</button>':''}
     </div></details>`;

  if(books.length){
    h += `<div class="panel"><h3>Book now</h3><ul class="booklist">${books.map(x=>`<li><input type="checkbox" id="bk-${x.a.id}" ${BOOKED[x.a.id]?'checked':''} aria-label="Booked: ${esc(x.a.t)}"><label for="bk-${x.a.id}"><b>${esc(x.a.t)}</b> · ${DAY[dayOf(P,x)].short} ${hm(x.s)}<small>${esc(bookHint(x.a))}${x.a.url?` · <a class="link" href="${esc(x.a.url)}" target="_blank" rel="noopener">website</a>`:''}</small></label></li>`).join('')}</ul>
      <p class="fine" style="margin:10px 0 0">${INN_SHORT} activity desk books tours for free: you can send them this list.</p></div>`;
  }

  for(const d of P.conf){
    const w=WX[d.id], its=P.state[d.id].items, dd=DAY[d.id], f=frame(P,d);
    const noLunch = its.length && !lunchInfo(P.state[d.id], d).ok;
    h += `<section class="day"><div class="day-h"><h2>${dd.name}</h2><span class="dwx">${sized(IC[w.ic],18)}${esc(w.line)}</span></div><p class="day-sub">${esc(stayLine(d.id))}${noLunch?' · <b>no real lunch break</b>: grab food between stops':''}</p><ul class="tl">`;
    if(d.id==='d7') h += fixedEv(hm(FLIGHT_IN), 'Land at Līhuʻe (LIH) · pick up the Turo car', `Early check-in at ${INN_SHORT} is arranged: drop the bags whenever it suits (20 min away).`, IC.plane);
    const checkoutEv = d.id==='d10' ? fixedEv(hm(f.checkout), `Check out of ${INN_SHORT}`, 'By 10:30. Keep bags out of sight in trailhead parking lots.', IC.bed)
      : d.id==='d11' ? fixedEv(hm(f.checkout), `Check out of ${HOTEL}`, 'About 1 hour to the airport.', IC.bed) : '';
    if(!its.length) h += `<li class="empty-day">${d.id==='d11'?'Free morning: a slow breakfast, then the airport.':'Free day. Add something from the list or keep swiping.'}</li>`;
    let pz = d.from;
    const ls = lunchInfo(P.state[d.id], d).slot;
    const lunchRow = ls ? `<li class="drive"><span>${hm(ls.at)}</span><span>${sized(IC.bowl,16)}Lunch break: eat nearby</span></li>` : '';
    its.forEach((it,i)=>{
      if(i===f.k) h += checkoutEv;
      h += driveRow(pz, it.zone);
      if(ls && ls.before===i) h += lunchRow;
      const thumb = HAS_IMG.has(it.a.id) ? `<img class="thumb" src="img/${it.a.id}.webp" alt="" loading="lazy">` : `<span class="thumb f-${it.a.cat}">${CAT_IC[it.a.cat]}</span>`;
      const price = it.a.pp||it.a.grp ? money(costOf(it.a)) : esc(it.a.p);
      h += `<li class="ev item" data-id="${it.a.id}" tabindex="0" role="button" aria-label="${esc(it.a.t)}, ${hm(it.s)}"><time>${hm(it.s)}<small>${hm(it.e)}</small></time>
        <div class="main"><div><h3>${esc(it.a.t)}</h3><div class="meta">${esc(it.where || it.a.op)} · ${price}</div><div class="tags">${itemTags(it)}</div></div>${thumb}</div></li>`;
      pz = it.zone;
    });
    if(f.k===its.length) h += checkoutEv;
    if(ls && ls.before===its.length) h += lunchRow;
    if(d.id==='d11'){
      h += driveRow(pz,'LIH');
      h += fixedEv(hm(carBack()),'Return the Turo car · Līhuʻe airport','Then the agriculture check for bags and security.', IC.car);
      h += fixedEv(hm(FLIGHT_OUT),'Flight LIH → LAX', 'Lands in Los Angeles at 22:42', IC.plane);
    } else {
      h += driveRow(pz, d.to);
      h += fixedEv(f.home!=null ? hm(f.home) : '', d.id==='d10' ? `Check in at ${HOTEL}` : `Back at ${INN_SHORT}`, d.id==='d10' ? 'Princeville · your last night' : 'Lāwaʻi', IC.bed);
    }
    h += `</ul></section>`;
  }

  if(P.unplaced.length){
    h += `<div class="panel"><h3>Doesn’t fit (yet)</h3><ul class="unp">${P.unplaced.map(L=>{
      const feas = L.a.days.filter(id=>dayFits(L.a,id));
      return `<li><b>${esc(L.a.t)}</b><span class="why2">${esc(L.reason)}</span><div class="chips">${feas.map(id=>`<button class="dchip" data-force="${L.a.id}" data-day="${id}">Put on ${DAY[id].short}</button>`).join('')}<button class="dchip" data-drop="${L.a.id}">Remove</button></div></li>`; }).join('')}</ul>
      <p class="fine" style="margin-top:10px">“Put on” pins the activity to that day and moves the rest around; whatever no longer fits lands here.</p></div>`;
  }
  if(P.alts.length){
    h += `<div class="panel"><h3>Alternatives set aside</h3><ul class="unp">${P.alts.map(x=>`<li><b>${esc(x.L.a.t)}</b><span class="why2">Same kind of outing as “${esc(x.of.t)}”: the plan keeps one. To switch, give this one a Hōkū or pick a day.</span><div class="chips">${x.L.a.days.filter(id=>dayFits(x.L.a,id)).map(id=>`<button class="dchip" data-force="${x.L.a.id}" data-day="${id}" data-swap="${x.of.id}">Use this on ${DAY[id].short}</button>`).join('')}</div></li>`).join('')}</ul></div>`;
  }
  const pins = Object.keys(PINS).length, ex = Object.keys(EXCL).length;
  if(pins||ex) h += `<div class="btnrow" style="margin-top:14px">${pins?`<button class="btn small" id="bUnpin">Unpin ${pins} ${pins===1?'activity':'activities'}</button>`:''}${ex?`<button class="btn small" id="bUnex">Bring back ${ex} removed</button>`:''}</div>`;

  h += `<footer class="foot">
    <span>Hours and status checked on Nov 5, 2026 with operators, Hawaiʻi State Parks (DLNR) and the NWS. After Hurricane Lowell things change fast: re-check the day before.</span>
    <span>Drive times are estimates in normal traffic; the Hanalei bridge is one lane at a time.</span>
    <button class="btn small" id="bCredits" style="justify-self:start">Sources and photo credits</button>
  </footer>`;
  v.innerHTML = h;
  bindPlan(P);
}
function dayOf(P,it){ for(const d of P.conf) if(P.state[d.id].items.includes(it)) return d.id; return 'd8'; }
function bookHint(a){
  const H = {

  };
  if(H[a.id]) return H[a.id];

}
function bindPlan(P){
  const v=$('#planView');
  $('#bBack',v).onclick=showDeck;

  const bi=$('#bIcs',v); if(bi) bi.onclick=()=>exportIcs(P);
  v.querySelectorAll('.ev.item').forEach(el=>{

  });
  v.querySelectorAll('.booklist input').forEach(cb=>cb.onchange=()=>{ const id=cb.id.slice(3); if(cb.checked) BOOKED[id]=true; else delete BOOKED[id]; save(); });
  v.querySelectorAll('[data-force]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.force; PINS[id]=b.dataset.day;
    if(b.dataset.swap){ delete PINS[b.dataset.swap]; if((DEC[id]||0)<3) DEC[id]=3; if(DEC[b.dataset.swap]===3) DEC[b.dataset.swap]=2; }
    save(); renderPlan(); toast(`${ACTM[id].t}: ${DAY[b.dataset.day].short}`); });
  v.querySelectorAll('[data-drop]').forEach(b=>b.onclick=()=>{ EXCL[b.dataset.drop]=true; delete PINS[b.dataset.drop]; save(); renderPlan(); toast('Removed from the plan'); });
  const up=$('#bUnpin',v); if(up) up.onclick=()=>{ PINS={}; save(); renderPlan(); };
  const ue=$('#bUnex',v); if(ue) ue.onclick=()=>{ EXCL={}; save(); renderPlan(); };

  $('#bCode',v).onclick=()=>copyText($('#myCode',v).value,'Code copied');
  $('#bJoin',v).onclick=()=>{ const r=readCode($('#theirCode',v).value); if(!r){ $('#duoMsg',v).textContent='That code doesn’t work: it must start with K and come from this same app.'; return; } PARTNER=r; save(); renderPlan(); toast('Picks merged'); };
  const uj=$('#bUnjoin',v); if(uj) uj.onclick=()=>{ PARTNER=null; save(); renderPlan(); };
}
function planItemActions(a){
  const P=lastPlan; let cur=null;
  if(P) for(const d of P.conf) for(const it of P.state[d.id].items) if(it.a.id===a.id) cur={d:d.id,it};

    <div class="chips">${feas.map(id=>`<button class="dchip ${PINS[a.id]===id?'on':''}" data-pin="${id}">${DAY[id].short}</button>`).join('')}${PINS[a.id]?'<button class="dchip" data-pin="">Let the plan choose</button>':''}</div>
    <div class="btnrow">${gcal}<button class="btn small" data-excl="1">Remove from the plan</button></div>`;
}
function bindPlanItemActions(sh,a){
  sh.querySelectorAll('[data-pin]').forEach(b=>b.onclick=()=>{ if(b.dataset.pin) PINS[a.id]=b.dataset.pin; else delete PINS[a.id]; save(); closeSheet(); renderPlan(); toast(b.dataset.pin?`Moved to ${DAY[b.dataset.pin].short}`:'The plan picks the day'); });
  const ex=sh.querySelector('[data-excl]'); if(ex) ex.onclick=()=>{ EXCL[a.id]=true; delete PINS[a.id]; save(); closeSheet(); renderPlan(); toast('Removed from the plan'); };
}

  const rows = ACT.filter(a=>CREDITS[a.id]).map(a=>{const c=CREDITS[a.id]; return `<li>${esc(a.t)}: ${esc(c.a||'unknown author')}, ${esc(c.l)} · <a href="${esc(c.u)}" target="_blank" rel="noopener">file</a></li>`;}).join('');

    <li><a href="https://bitessightsflights.com/kauai-closures/" target="_blank" rel="noopener">Kauaʻi closures tracker</a> (updated Nov 5)</li>
    <li><a href="https://www.kauai.com/kauai-farmers-markets" target="_blank" rel="noopener">kauai.com farmers markets</a> (updated Oct 31)</li>
    <li><a href="https://www.thegardenisland.com/?p=425496" target="_blank" rel="noopener">The Garden Island</a>: 1 Hotel Hanalei Bay reopening; <a href="https://www.princeville.com/press/cocktails-1-hotel-hanalei-bay" target="_blank" rel="noopener">Princeville</a>: its restaurants</li>
    <li>Operator websites: Makana Charters, Capt Andy’s, Holo Holo, Kauai Backcountry, Kipu Ranch, Princeville Ranch, Skydive Kauai, Smith’s, Lāwaʻi Center, NTBG, Himalayan Academy, Recreation.gov</li>
   </ul>
   <h3>Photos (Wikimedia Commons and Flickr via Openverse, Creative Commons)</h3><p class="fine">Photos are illustrative and may not show the exact place or operator.</p><ul class="credits">${rows}</ul>`);
}

/* ---------- export ---------- */
function utc(dateStr, min){ const [y,m,d]=dateStr.split('-').map(Number); const t=new Date(Date.UTC(y,m-1,d, 10, 0) + min*60000); return t.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,''); }
function evDesc(a){
  return [a.why, `Price: ${a.p} ${a.pu||''}`.trim(), a.book?`Booking: ${bookHint(a)}`:'', a.st!=='ok'?`To verify: ${a.stx}`:'', a.url||''].filter(Boolean).join('\n');
}
function evLoc(a, it){ return `${it.where || a.op}, Kauaʻi`; }
function gcalUrl(a, dId, it){
  const q = new URLSearchParams({action:'TEMPLATE', text:a.t, dates:`${utc(DAY[dId].date,it.s)}/${utc(DAY[dId].date,it.e)}`, details:evDesc(a), location:evLoc(a,it), ctz:'Pacific/Honolulu'});
  return 'https://calendar.google.com/calendar/render?' + q.toString();
}
function icsEsc(s){ return String(s).replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;'); }
function fold(line){ const out=[]; let cur=''; let bytes=0; const enc=new TextEncoder();
  for(const ch of line){ const b=enc.encode(ch).length; if(bytes+b>73){ out.push(cur); cur=' '+ch; bytes=1+b; } else { cur+=ch; bytes+=b; } }
  out.push(cur); return out.join('\r\n'); }
function buildIcs(P){
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Kauai Match//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Kauaʻi · Nov 7–11','X-WR-TIMEZONE:Pacific/Honolulu'];
  const stamp = new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
  const ev=(uid,date,s,e,title,loc,desc)=>{ L.push('BEGIN:VEVENT',`UID:${uid}@kauai-match`,`DTSTAMP:${stamp}`,`DTSTART:${utc(date,s)}`,`DTEND:${utc(date,e)}`,fold('SUMMARY:'+icsEsc(title)),fold('LOCATION:'+icsEsc(loc)),fold('DESCRIPTION:'+icsEsc(desc)),'END:VEVENT'); };
  ev('arrive','2026-11-07',FLIGHT_IN,FLIGHT_IN+45,'Land at Līhuʻe · pick up the Turo car','Līhuʻe Airport (LIH)',`Flight from LAX. Then 20 min to ${INN}, Lāwaʻi (early check-in arranged).`);
  for(const d of P.conf){
    const f=frame(P,d);
    if(d.id==='d10') ev('checkout-inn',DAY.d10.date,f.checkout,f.checkout+15,`Check out of ${INN_SHORT} (by 10:30)`,`${INN}, Lāwaʻi`,`Tonight: ${HOTEL}, Princeville.`);
    if(d.id==='d11') ev('checkout-hotel',DAY.d11.date,f.checkout,f.checkout+15,`Check out of ${HOTEL}`,`${HOTEL}, Princeville`,'About 1 hour to the airport.');
    for(const it of P.state[d.id].items) ev(`${it.a.id}-${d.id}`, DAY[d.id].date, it.s, it.e, it.a.t, evLoc(it.a,it), evDesc(it.a));
  }
  ev('car','2026-11-11',carBack(),carBack()+30,'Return the Turo car','Līhuʻe Airport (LIH)','Then the agriculture check for bags and security.');
  ev('flight','2026-11-11',FLIGHT_OUT,FLIGHT_OUT+30,'Flight LIH → LAX','Līhuʻe Airport (LIH)','Lands in Los Angeles at 22:42.');
  L.push('END:VCALENDAR');
  return L.join('\r\n')+'\r\n';
}
const CRC = (()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();
function crc32(b){ let c=0xFFFFFFFF; for(let i=0;i<b.length;i++) c = CRC[(c^b[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function zip(files){
  const enc=new TextEncoder(), parts=[], cen=[]; let off=0;
  const DOS_T=(12<<11), DOS_D=((2026-1980)<<9)|(11<<5)|5;
  for(const f of files){
    const nm=enc.encode(f.name), data=f.data, crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true); lh.setUint16(8,0,true);
    lh.setUint16(10,DOS_T,true); lh.setUint16(12,DOS_D,true); lh.setUint32(14,crc,true); lh.setUint32(18,data.length,true); lh.setUint32(22,data.length,true);
    lh.setUint16(26,nm.length,true); lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer), nm, data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0x0800,true); ch.setUint16(10,0,true);
    ch.setUint16(12,DOS_T,true); ch.setUint16(14,DOS_D,true); ch.setUint32(16,crc,true); ch.setUint32(20,data.length,true); ch.setUint32(24,data.length,true);
    ch.setUint16(28,nm.length,true); ch.setUint16(30,0,true); ch.setUint16(32,0,true); ch.setUint16(34,0,true); ch.setUint16(36,0,true); ch.setUint32(38,0,true); ch.setUint32(42,off,true);
    cen.push(new Uint8Array(ch.buffer), nm);
    off += 30 + nm.length + data.length;
  }
  const cs = cen.reduce((t,p)=>t+p.length,0);
  const end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true); end.setUint16(8,files.length,true); end.setUint16(10,files.length,true); end.setUint32(12,cs,true); end.setUint32(16,off,true);
  const all=[...parts,...cen,new Uint8Array(end.buffer)], out=new Uint8Array(all.reduce((t,p)=>t+p.length,0));
  let p=0; for(const a of all){ out.set(a,p); p+=a.length; } return out;
}
async function exportIcs(P){
  const ics = buildIcs(P);
  if(DL){
    const data = zip([{name:'kauai-plan.ics', data:new TextEncoder().encode(ics)}]);
    try{ await DL.save({filename:'kauai-plan.zip', data}); toast('Calendar ready'); }
    catch(e){ const c=e&&e.code; toast(c==='declined'?'Download cancelled':c==='rate_limited'?'Wait a moment and try again':'Download not available here'); if(c==='unavailable'||c==='not_granted'||c==='extension_not_enabled'){ DL=null; renderPlan(); } }
    return;
  }
  if(NATIVE){
    try{
      const url = URL.createObjectURL(new Blob([ics],{type:'text/calendar;charset=utf-8'}));
      const link = document.createElement('a'); link.href=url; link.download='kauai-plan.ics';
      document.body.appendChild(link); link.click(); link.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 5000);
      toast('Calendar downloaded');
    }catch(e){ toast('Download not available here'); }
    return;
  }
  toast('Download not available here');
}
function planText(P){
  const out=['KAUAʻI · Nov 7–11', `Sat 7 · 11:03 land at Līhuʻe, Turo car → ${INN} (Lāwaʻi)`];
  for(const d of P.conf){
    out.push('', `${DAY[d.id].name} — ${WX[d.id].line}`);
    const its=P.state[d.id].items, f=frame(P,d), ls=lunchInfo(P.state[d.id],d).slot;
    const co = d.id==='d10' ? `  ${hm(f.checkout)} check out of ${INN_SHORT} (by 10:30)` : d.id==='d11' ? `  ${hm(f.checkout)} check out of ${HOTEL}` : '';
    if(!its.length) out.push('  free');
    its.forEach((it,i)=>{
      if(co && i===f.k) out.push(co);
      if(ls && ls.before===i) out.push(`  ${hm(ls.at)} lunch break`);
      out.push(`  ${hm(it.s)}–${hm(it.e)} ${it.a.t} (${it.where||it.a.op})${it.a.book?(BOOKED[it.a.id]?' · booked':' · TO BOOK'):''}`);
    });
    if(co && f.k===its.length) out.push(co);
    if(ls && ls.before===its.length) out.push(`  ${hm(ls.at)} lunch break`);
    if(d.id==='d10') out.push(`  night at ${HOTEL}`);
    if(d.id==='d11') out.push(`  ${hm(carBack())} return the car · ${hm(FLIGHT_OUT)} flight to LAX`);
  }
  return out.join('\n');
}
async function copyText(txt, msg='Plan copied'){
  try{ await navigator.clipboard.writeText(txt); toast(msg); }
  catch(e){ openSheet(`<h2 id="sheetTitle">Copy by hand</h2><p class="sub">Press and hold to select everything.</p><textarea style="width:100%;min-height:50vh;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:10px;font:14px/1.4 var(--body)" readonly>${esc(txt)}</textarea>`); const ta=$('#sheet textarea'); ta.focus(); ta.select(); }
}

/* ---------- partner code ---------- */
function b64u(bytes){ let s=''; bytes.forEach(b=>s+=String.fromCharCode(b)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function unb64u(str){ const s=str.replace(/-/g,'+').replace(/_/g,'/'); const pad=s+'==='.slice((s.length+3)%4); const bin=atob(pad); return Uint8Array.from(bin,c=>c.charCodeAt(0)); }
function myCode(){ const bytes=new Uint8Array(Math.ceil(ACT.length/4)); ACT.forEach((a,i)=>{ const v=DEC[a.id]||0; bytes[i>>2] |= v<<((i&3)*2); }); return 'K'+b64u(bytes); }
function readCode(code){
  code=(code||'').trim(); if(!/^K[A-Za-z0-9_-]+$/.test(code)) return null;
  let bytes; try{ bytes=unb64u(code.slice(1)); }catch(e){ return null; }
  if(bytes.length!==Math.ceil(ACT.length/4)) return null;
  const out={}; ACT.forEach((a,i)=>{ const v=(bytes[i>>2]>>((i&3)*2))&3; if(v) out[a.id]=v; }); return out;
}

/* ---------- boot ---------- */
function boot(){
  load();
  $('#bSet').innerHTML=IC.gear; $('#bList').innerHTML=IC.list; $('#bUndo').innerHTML=IC.undo; $('#bNo').innerHTML=IC.x; $('#bStar').innerHTML=IC.star; $('#bYes').innerHTML=IC.heart; $('#bInfo').innerHTML=IC.info;
  renderWx(); renderDeck();
  $('#bNo').onclick=()=>decide(1); $('#bYes').onclick=()=>decide(2); $('#bStar').onclick=()=>decide(3);
  $('#bUndo').onclick=undo; $('#bInfo').onclick=()=>{ const q=queue(); if(q[0]) openDetails(q[0].id); };
  $('#bPlan').onclick=()=>{ if(view()==='plan') showDeck(); else showPlan(); };
  $('#bList').onclick=()=>{ if(view()==='list') showDeck(); else showList(); };
  $('#wxStrip').onclick=openWeather; $('#bSet').onclick=openSettings;
  $('#backdrop').onclick=closeSheet;
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape' && !$('#sheet').hidden){ closeSheet(); return; }
    if(!$('#sheet').hidden || view()!=='deck') return;
    if(e.target.matches('input,select,textarea')) return;
    if(e.key==='ArrowRight') decide(2); else if(e.key==='ArrowLeft') decide(1); else if(e.key==='ArrowUp') decide(3);
    else if(e.key==='Backspace'){ e.preventDefault(); undo(); }
  });
  try{ window.claude?.use?.('downloads').then(d=>{ DL=d||null; if(view()==='plan') renderPlan(); }).catch(()=>{}); }catch(e){}
}
boot();
